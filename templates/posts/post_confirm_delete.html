{% extends 'base.html' %}
{% block title %}Eliminar post · Blog{% endblock %}
{% block content %}
<h1>Eliminar post</h1>
<p>¿Seguro que querés eliminar «{{ object.titulo }}»? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
